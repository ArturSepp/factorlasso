[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factorlasso"
version = "0.18.0"
description = "Sparse multi-output factor-model estimation with sign constraints, prior-centered shrinkage, data-driven grouped penalties, and consistent factor covariance assembly"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
]
keywords = [
    "lasso",
    "group-lasso",
    "sparse-group-lasso",
    "adaptive-lasso",
    "hcgl",
    "factor-model",
    "penalized-regression",
    "sparse-regression",
    "sign-constraints",
    "cluster-pooled-sign-derivation",
    "covariance-estimation",
    "cvxpy",
    "multi-output-regression",
    "multi-response-regression",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "cvxpy>=1.3.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
    "numpydoc>=1.5",
]
# Dependencies for the in-repo simulation harness
# (``papers/jss_2026/simulations/`` directory).
# Not required by the published wheel; install with::
#
#     pip install factorlasso[simulations]
#
# or for editable development from the repo::
#
#     pip install -e ".[simulations]"
#
# Notes on the included solvers:
# - ``scs`` and ``ecos`` are added so the simulation harness's
#   CLARABEL→ECOS→SCS solver fallback chain has a real fallback
#   available. Production rosaa code does not retry on solver failure;
#   it surfaces the underlying problem. The harness, however, must
#   complete the full study grid even when a small fraction of cells
#   hit numerically pathological problem instances.
simulations = [
    "pyyaml>=6.0",
    "joblib>=1.2",
    "pyarrow>=12.0",
    "scs>=3.0",
    "ecos>=2.0",
]

[dependency-groups]
test = [
    "pytest>=8.2",
    "pytest-cov>=4.0",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
]
lint = [
    "interrogate==1.7.0",
    "ruff==0.16.2",
]
audit = [
    "pip-audit==2.10.1",
]

[project.urls]
Homepage = "https://github.com/ArturSepp/factorlasso"
Documentation = "https://factorlasso.readthedocs.io"
Repository = "https://github.com/ArturSepp/factorlasso"
Issues = "https://github.com/ArturSepp/factorlasso/issues"
Changelog = "https://github.com/ArturSepp/factorlasso/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["factorlasso*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]

# --- stack invariants as lint, not prose ---------------------------------------------------
# TID251 bans an import outright, TID253 bans it only at module level, ICN pins the numpy and
# pandas aliases. All are green on the repository as it stands.
extend-select = ["TID251", "TID253", "ICN"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# A1: factorlasso is a leaf. It must never import qis -- the small dependency surface
# (numpy, pandas, scipy, cvxpy, openpyxl) is a JSS submission constraint, not a preference.
"qis".msg = "A1/JSS: factorlasso must never import qis; the dependency surface is a JSS constraint."
"optimalportfolios".msg = "A1: factorlasso is a leaf; optimalportfolios depends on it, not the reverse."
"trendfollowing".msg = "A1: factorlasso is a leaf."
"privateassets".msg = "A1: factorlasso is a leaf."
"stochvolmodels".msg = "A1: factorlasso is a leaf."

[tool.ruff.lint.flake8-tidy-imports]
# scikit-learn is a test-group dependency, never a runtime one: compatibility is achieved by
# following its conventions, not by depending on it. A module-level import fails; the
# `__sklearn_tags__` shim in lasso_estimator.py imports sklearn.utils inside the method behind a
# try/except and is allowed by design, which is why this is TID253 rather than a flat TID251 ban.
banned-module-level-imports = ["sklearn"]

[tool.ruff.lint.per-file-ignores]
# scikit-learn is a legitimate test dependency in the material that is not the shipped package
"tests/**" = ["TID253"]
"benchmarks/**" = ["TID253"]
"papers/**" = ["TID253"]

[tool.ruff.lint.flake8-import-conventions.aliases]
# replaces ruff's default alias map, which also demands `matplotlib as mpl` everywhere. Only
# numpy and pandas are house convention; matplotlib is legitimately both `mpl` and `plt` here.
numpy = "np"
pandas = "pd"

[tool.coverage.run]
source = ["factorlasso"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.interrogate]
fail-under = 89.8
