# SHARED CI CORE v1.3 — weekly tiered audit
name: Audit

permissions:
  contents: read

on:
  workflow_call:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths: [pyproject.toml, uv.lock, .github/stack-policy.json, .github/workflows/audit.yml]
  pull_request:
    branches: [main]
    paths: [pyproject.toml, uv.lock, .github/stack-policy.json, .github/workflows/audit.yml]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  core:
    name: Core dependencies (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Resolve latest and locked core trees
        run: |
          uv pip compile --python-version 3.12 --quiet \
            pyproject.toml -o "$RUNNER_TEMP/core-latest.txt"
          uv export --locked --no-default-groups --no-emit-project --quiet \
            --format requirements-txt -o "$RUNNER_TEMP/core-locked.txt"
      - name: Audit latest core tree
        run: uv run --locked --only-group audit pip-audit -r "$RUNNER_TEMP/core-latest.txt"
      - name: Audit locked core tree
        if: ${{ !cancelled() }}
        run: uv run --locked --only-group audit pip-audit -r "$RUNNER_TEMP/core-locked.txt"

  optional:
    name: Optional extras (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Resolve latest and locked optional-extra trees
        run: |
          uv pip compile --all-extras --python-version 3.12 --quiet \
            pyproject.toml -o "$RUNNER_TEMP/optional-latest.txt"
          uv export --locked --all-extras --no-default-groups --no-emit-project --quiet \
            --format requirements-txt -o "$RUNNER_TEMP/optional-locked.txt"
      - name: Audit latest optional-extra tree
        run: uv run --locked --only-group audit pip-audit -r "$RUNNER_TEMP/optional-latest.txt"
      - name: Audit locked optional-extra tree
        if: ${{ !cancelled() }}
        run: uv run --locked --only-group audit pip-audit -r "$RUNNER_TEMP/optional-locked.txt"

  dependency-boundary:
    name: JSS dependency boundary drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Resolve core and test trees
        run: |
          uv pip compile --python-version 3.12 --quiet \
            pyproject.toml -o "$RUNNER_TEMP/core.txt"
          uv pip compile --group test --python-version 3.12 --quiet \
            pyproject.toml -o "$RUNNER_TEMP/test.txt"
      - name: Assert the five-package JSS dependency boundary
        run: |
          uv run --no-project python - "$RUNNER_TEMP/core.txt" "$RUNNER_TEMP/test.txt" <<'PY'
          import json
          import re
          import sys
          import tomllib

          def normalise(name):
              return name.lower().replace("_", "-").replace(".", "-")

          def requirement_name(spec):
              return normalise(re.split(r"[<>=!~; \[]", spec, maxsplit=1)[0])

          with open("pyproject.toml", "rb") as fh:
              cfg = tomllib.load(fh)

          expected_core = {"numpy", "pandas", "scipy", "cvxpy", "openpyxl"}
          declared_core = {requirement_name(spec) for spec in cfg["project"]["dependencies"]}
          assert declared_core == expected_core, (
              "JSS core dependency surface changed: "
              f"expected {sorted(expected_core)}, found {sorted(declared_core)}"
          )

          tidy = cfg["tool"]["ruff"]["lint"]["flake8-tidy-imports"]
          banned_stack = {normalise(name) for name in tidy["banned-api"]}
          with open(".github/stack-policy.json", encoding="utf-8") as fh:
              policy = json.load(fh)
          assert not policy["core"] and not policy["optional"], "JSS package must remain a stack leaf"
          expected_banned = {normalise(name) for name in policy["forbidden"]}
          assert banned_stack == expected_banned, "the declared stack leaf boundary drifted"

          def resolved(path):
              names = set()
              for line in open(path, encoding="utf-8"):
                  line = line.split("#", 1)[0].strip()
                  if line and not line.startswith("-"):
                      names.add(normalise(line.split("==", 1)[0]))
              return names

          core = resolved(sys.argv[1])
          test = resolved(sys.argv[2])
          for label, names in (("core", core), ("test", test)):
              leaked = sorted(names & banned_stack)
              assert not leaked, f"{label} dependency tree contains banned stack packages: {leaked}"

          optional_in_core = sorted(core & {"scikit-learn", "matplotlib"})
          assert not optional_in_core, f"optional test packages reached the core tree: {optional_in_core}"
          print("JSS dependency boundary clean: five core packages; no banned stack packages")
          PY
